name: Turno
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  turno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - run: python mundo.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name bot
          git config user.email bot@example.com
          git add mundo.md relacoes.json estado.json
          git commit -m turno || exit 0
          git push
      - name: Notificar
        run: |
          tail -n 7 mundo.md | sed 's/\*//g' | curl -s -H "Title: Vila" -d @- https://ntfy.sh/vila-fema-7391xk
